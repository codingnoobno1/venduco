<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head('Sign in')}"></head>
<body class="centered">
<main class="card login">
    <h1>Vendor<span>Connect</span> Admin</h1>
    <p class="muted">Sign in with an administrator account.</p>

    <p class="notice error" th:if="${param.error}" role="alert">Sign-in failed. Check your email and password.</p>
    <p class="notice success" th:if="${param.logout}" role="status">You have been signed out.</p>

    <form th:action="@{/admin/login}" method="post">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="primary">Sign in</button>
    </form>
</main>
</body>
</html>
