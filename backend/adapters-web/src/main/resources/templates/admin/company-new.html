<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head('Add company')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{admin/_layout :: sidebar('companies')}"></aside>
    <main>
        <p class="crumbs"><a th:href="@{/admin/companies}">Companies</a> /</p>
        <h1>Add company</h1>
        <p class="lead">A company you add here is approved straight away. Companies that register themselves wait in Approvals.</p>
        <p class="notice error" th:if="${error}" th:text="${error}" role="alert">Problem.</p>

        <form class="card narrow" th:action="@{/admin/companies}" method="post">
            <label for="name">Company name</label>
            <input id="name" name="name" th:value="${name}" required minlength="2" maxlength="160">

            <label for="type">Type</label>
            <select id="type" name="type">
                <option th:each="t : ${types}" th:value="${t}" th:selected="${t == type}"
                        th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(t, '_', ' ')))}">Vendor</option>
            </select>

            <button type="submit" class="primary">Add company</button>
            <a th:href="@{/admin/companies}">Cancel</a>
        </form>
    </main>
</div>
</body>
</html>
